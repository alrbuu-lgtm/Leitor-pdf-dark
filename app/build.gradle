plugins { id 'com.android.application' }
android {
    namespace 'com.darkreader.leitorpdf'
    compileSdk 36
    defaultConfig {
        applicationId 'com.alrbuu.leitorpdfdark'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OCR agrupado no APK para também ler PDFs digitalizados.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Modelo EN-PT obtido no primeiro uso; uso posterior offline.
    implementation 'com.google.mlkit:translate:17.0.3'
}
